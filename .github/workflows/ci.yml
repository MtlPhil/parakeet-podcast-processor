name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    # Apple Silicon runner: matches the target platform and installs
    # parakeet-mlx plus a CPU-only PyTorch for Whisper.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,web]"
      - name: black
        run: black --check .
      - name: isort
        run: isort --check-only .
      - name: mypy
        run: mypy p3/
      - name: pytest
        run: pytest tests/ -q
        env:
          PYTHONPATH: .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
