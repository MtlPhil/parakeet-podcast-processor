name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    # macOS on Apple Silicon is the platform P3 transcribes on (it installs
    # the MLX speech engines). Linux has no speech engine yet, but everything
    # else must keep working there. Neither job loads a model.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the locked dependencies
        run: |
          pip install uv
          uv sync --frozen --extra dev --extra web
      - name: black
        run: uv run --no-sync black --check .
      - name: isort
        run: uv run --no-sync isort --check-only .
      - name: mypy
        run: uv run --no-sync mypy p3/
      - name: pytest
        run: uv run --no-sync pytest tests/ -q

  container:
    # Builds the image and checks that the server in it starts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t p3 .
      - name: Start it and ask for its status
        run: |
          docker run -d --name p3 -p 8000:8000 p3
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/auth/status && exit 0
            sleep 2
          done
          docker logs p3
          exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
